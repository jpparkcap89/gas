
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>JP's GAS LAB</title>

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
        rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f8faf6;
      font-family: 'Noto Sans KR', sans-serif;
    }

    .app-frame {
      display: block;
      width: 100%;
      height: 100dvh;
      border: none;
      background: #f8faf6;
    }

    .fallback {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 100;
    }

    .fallback a {
      display: inline-flex;
      align-items: center;
      padding: 10px 16px;
      border-radius: 999px;
      background: #668b78;
      color: white;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 5px 20px #0002;
    }

    .fallback a:hover {
      background: #527562;
    }

    @media (max-width: 768px) {
      .fallback {
        right: 10px;
        bottom: 10px;
      }

      .fallback a {
        padding: 8px 12px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <!-- 기존 GAS 웹앱을 그대로 표시 -->
  <iframe
    id="gasApp"
    class="app-frame"
    title="JP's GAS LAB"
    src="https://script.google.com/macros/s/AKfycbzACE1QQuLGoLZQmC7JiSU3o_XXlr9bXxNWTVe9L_264CwW2_6TVFGgpoccpHi3YrQ/exec"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

  <!-- 직접 실행 대체 링크 -->
  <div class="fallback">
    <a
      href="https://script.google.com/macros/s/AKfycbzACE1QQuLGoLZQmC7JiSU3o_XXlr9bXxNWTVe9L_264CwW2_6TVFGgpoccpHi3YrQ/exec"
      target="_blank"
      rel="noopener noreferrer">
      ↗ 앱 직접 열기
    </a>
  </div>

</body>
</html>
