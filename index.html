<style>
:root{--bg:#f8faf6;--ink:#34443d;--muted:#66766f;--main:#668b78;--mint:#e7f3ea;--peach:#fff0dc;--pink:#fbe6eb;--lav:#e8eeff;--line:#e4ebe5;--shadow:0 6px 24px rgba(54,72,62,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #9ec9ae;outline-offset:2px}.wrap{width:85%;max-width:1320px;margin:auto}.hero{background:linear-gradient(120deg,#e7f3ea 3%,#fff0dc 56%,#e8eeff 100%);padding:34px 0 42px;border-radius:0 0 30px 30px}.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow{font-size:12px;font-weight:800;color:#587966;letter-spacing:.04em}.hero h1{margin:20px 0 8px;font-size:clamp(26px,3vw,42px);letter-spacing:-.04em}.subtitle{margin:0;color:var(--muted);line-height:1.7}.hero-actions{display:flex;gap:9px;align-items:center}.btn,.icon-btn{border:1px solid var(--line);background:white;border-radius:14px;padding:11px 16px;color:var(--ink);font-weight:700;transition:transform .2s,box-shadow .2s,background .2s}.btn:hover,.icon-btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px #668b7833}.btn:active,.icon-btn:active{transform:scale(.96)}.btn.primary{background:var(--main);color:white;border-color:var(--main)}.btn.danger{color:#b33b4b;background:#fff0f1}.btn.small{padding:8px 12px;font-size:13px}.icon-btn{padding:9px 12px}.stats{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}.stat{background:#ffffffc9;padding:9px 14px;border-radius:12px;color:#53695c;font-weight:700;font-size:13px}.toolbar{background:white;border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:-22px;position:relative;box-shadow:var(--shadow);display:flex;flex-wrap:wrap;gap:12px;align-items:center}.search{flex:1;min-width:220px}.field{width:100%;border:1px solid #dce6dd;border-radius:12px;background:#fff;padding:12px;color:var(--ink);outline:none}.field:focus{border-color:var(--main)}.toolbar select{min-width:130px}.filters{display:flex;gap:8px}.chip{border:1px solid var(--line);border-radius:999px;background:white;padding:9px 14px;color:var(--muted);font-weight:700}.chip.active{background:var(--mint);color:#456f56;border-color:#bcd8c4}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:25px 0 15px}.section-head h2{font-size:21px;margin:0}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-bottom:45px}.card{position:relative;display:flex;flex-direction:column;background:white;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s,border .25s;animation:rise .45s both}.card:hover{transform:translateY(-5px);box-shadow:0 14px 28px #58796620;border-color:#b9d5c1}.thumb{background:linear-gradient(135deg,var(--mint),var(--lav));height:168px;display:grid;place-items:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;object-position:top}.fallback{font-size:50px}.card-body{padding:18px;display:flex;flex-direction:column;flex:1;gap:9px}.card h3{font-size:18px;margin:0;word-break:keep-all}.desc{color:var(--muted);font-size:14px;line-height:1.6;white-space:pre-line;flex:1;min-height:42px}.card-bottom{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:5px}.pill{padding:5px 9px;background:var(--peach);border-radius:9px;font-size:12px;font-weight:700}.edit-pencil{position:absolute;right:12px;top:12px;z-index:2;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;box-shadow:var(--shadow)}.list-view{grid-template-columns:1fr}.list-view .card{flex-direction:row;min-height:130px}.list-view .thumb{width:210px;height:auto;flex-shrink:0}.list-view .card-body{padding:18px 22px}.empty{grid-column:1/-1;text-align:center;padding:65px 12px;background:white;border-radius:20px;color:var(--muted)}footer{text-align:center;padding:25px;color:var(--muted);font-size:12px}.overlay{display:none;position:fixed;inset:0;background:#17271f99;backdrop-filter:blur(4px);z-index:1000;align-items:center;justify-content:center;padding:14px}.overlay.show{display:flex}.modal{width:min(100%,650px);max-height:90vh;background:white;border-radius:22px;box-shadow:0 25px 70px #0003;display:flex;flex-direction:column;animation:rise .22s both}.modal.narrow{max-width:420px}.modal-head{padding:20px 22px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}.modal-head h2{font-size:19px;margin:0}.modal-content{padding:6px 22px 22px;overflow:auto}.modal-foot{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:9px;margin-top:16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-row{margin-top:12px}.form-row label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.form-row textarea{min-height:82px;resize:vertical}.form-row.wide{grid-column:1/-1}.detail-img{display:block;width:100%;max-height:275px;object-fit:contain;background:#f8faf6;border-radius:14px;margin-bottom:15px}.instructions{background:#f8faf6;padding:13px;border-radius:12px;white-space:pre-wrap;line-height:1.75;font-size:14px}.upload-zone{border:2px dashed #d4e2d7;border-radius:13px;padding:15px;text-align:center;background:#f8faf6;cursor:pointer}.upload-zone img{max-height:140px;max-width:100%;border-radius:10px}.edit-list{list-style:none;padding:0;margin:0}.edit-list li{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.edit-list li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.handle{cursor:grab;color:var(--muted);padding:6px}.muted{color:var(--muted);font-size:13px;line-height:1.6}.toast{position:fixed;right:20px;bottom:18px;background:#34443d;color:white;border-radius:14px;padding:13px 18px;z-index:2000;box-shadow:var(--shadow);max-width:min(390px,90vw);display:none}.toast.show{display:block}.hidden{display:none!important}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(max-width:960px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:768px){.wrap{width:100%;padding-left:16px;padding-right:16px}.hero{padding-top:23px}.cards{grid-template-columns:1fr;gap:14px}.toolbar{margin-left:16px;margin-right:16px}.section-head{padding:0 16px}.form-grid{grid-template-columns:1fr}.list-view .thumb{width:115px}.list-view .card-body{padding:12px}.hero h1{margin-top:19px}.modal-content{padding:5px 16px 18px}.modal-head{padding:17px 16px 10px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.hero-categories{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}.hero-chip{border:1px solid #d5e4d9;background:#ffffffdb;color:var(--ink);border-radius:999px;padding:10px 16px;font-size:13px;font-weight:800;transition:transform .2s,box-shadow .2s,background .2s}.hero-chip:hover{transform:translateY(-2px);box-shadow:0 8px 18px #668b782b}.hero-chip.active{background:var(--main);color:white;border-color:var(--main)}@media(max-width:768px){.hero-categories{gap:7px}.hero-chip{padding:9px 13px}}.category-badge{align-self:flex-start;display:inline-block;padding:4px 10px;border-radius:999px;background:var(--mint);color:#466d55;font-size:11px;font-weight:800;margin-bottom:8px}.toolbar #categoryFilter{width:auto;min-width:150px;max-width:220px}@media(max-width:650px){.toolbar #categoryFilter{width:100%;max-width:none}}
</style>
</head>
<body>
<header class="hero"><div class="wrap"><div class="hero-top"><span id="badge" class="eyebrow">CAP89 · Google Apps Script</span><div class="hero-actions"><button id="adminBtn" class="icon-btn" aria-label="관리자 로그인">⚙️ 관리</button><button id="logoutBtn" class="btn small hidden">로그아웃</button></div></div><h1 id="appTitle">나의 GAS 앱 모음 🚀</h1><p class="subtitle" id="subtitle">수업과 학교 업무를 위한 앱 모음</p><div id="heroCategories" class="hero-categories" role="group" aria-label="앱 카테고리"><button class="hero-chip active" type="button" data-category="all">전체</button></div><div class="stats"><span class="stat" id="totalStat">전체 앱 불러오는 중…</span><span class="stat" id="copyStat">사본 제공 —</span></div></div></header>
<div class="wrap"><div class="toolbar"><input class="field search" id="search" type="search" placeholder="🔎 앱 이름 또는 설명 검색" aria-label="앱 검색"><div class="filters"><button class="chip active" id="filterAll">전체</button><button class="chip" id="filterCopy">사본 제공</button></div><select class="field" id="sort" aria-label="정렬"><option value="order">기본 순서</option><option value="title">이름순</option></select><button class="icon-btn" id="viewBtn" aria-label="목록 보기로 전환">☷ 목록</button></div><div class="section-head"><h2>📚 앱 둘러보기</h2><button id="newBtn" class="btn primary small hidden">＋ 새 앱 등록</button></div><main id="cards" class="cards"><div class="empty">앱 목록을 불러오는 중…</div></main></div><footer id="footerText">Made with CAP89</footer>
<div class="overlay" id="overlay"><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle"></h2><button id="modalClose" class="icon-btn" aria-label="모달 닫기">✕</button></div><div class="modal-content" id="modalContent"></div></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const DEFAULT_CATEGORIES=['학교업무','수업도구','학급관리','교사연수','학생활동','기타'];
let items=[],settings={},token='',filter='all',view='grid',sort='order',selectedCategory='all',modalType='',editId='',imageValue='',imageRemoved=false,working=false,orderIds=[];
const $=id=>document.getElementById(id);
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const validUrl=value=>{try{const u=new URL(/^https?:\/\//i.test(value)?value:'https://'+value);return ['http:','https:'].includes(u.protocol)?u.href:''}catch(e){return ''}};
const toast=message=>{const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(el.timer);el.timer=setTimeout(()=>el.classList.remove('show'),3200)};
// GAS 웹앱 배포 후 아래 /exec URL만 실제 주소로 변경하세요.
const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzACE1QQuLGoLZQmC7JiSU3o_XXlr9bXxNWTVe9L_264CwW2_6TVFGgpoccpHi3YrQ/exec';
const BRIDGE_CHANNEL = 'CAP89_GAS_BRIDGE_V1';
const BRIDGE_URL = GAS_WEB_APP_URL.indexOf('?') < 0
  ? GAS_WEB_APP_URL + '?bridge=1'
  : GAS_WEB_APP_URL + '&bridge=1';
const pendingCalls = new Map();
let bridgeReady = false;
let bridgeFrame = null;
let bridgeOrigin = '';
let nextCallId = 0;
const trustedBridgeOrigins = new Set([
  'https://script.google.com',
  'https://script.googleusercontent.com'
]);
function bridgeInit() {
  if (!/^https:\/\/script\.google\.com\/(?:macros|a\/macros)\//.test(GAS_WEB_APP_URL)
      || !/\/exec(?:\?|$)/.test(GAS_WEB_APP_URL)) {
    throw new Error('GitHub index.html의 GAS_WEB_APP_URL에 배포된 /exec 주소를 넣어 주세요.');
  }
  bridgeFrame = document.createElement('iframe');
  bridgeFrame.setAttribute('title', 'GAS 데이터 연결');
  bridgeFrame.setAttribute('aria-hidden', 'true');
  bridgeFrame.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0';
  bridgeFrame.src = BRIDGE_URL;
  document.body.appendChild(bridgeFrame);
  bridgeFrame.addEventListener('load', function() { bridgePing(); });
}
function bridgePing() {
  if (!bridgeFrame || !bridgeFrame.contentWindow) return;
  for (const origin of trustedBridgeOrigins) {
    bridgeFrame.contentWindow.postMessage({channel:BRIDGE_CHANNEL,kind:'ping'}, origin);
  }
}
window.addEventListener('message', function(event) {
  if (!bridgeFrame || event.source !== bridgeFrame.contentWindow) return;
  if (!trustedBridgeOrigins.has(event.origin)) return;
  const data = event.data;
  if (!data || data.channel !== BRIDGE_CHANNEL) return;
  if (data.kind === 'ready') {
    bridgeReady = true;
    bridgeOrigin = event.origin;
    window.dispatchEvent(new Event('gas-bridge-ready'));
    return;
  }
  if (data.kind !== 'response') return;
  const item = pendingCalls.get(data.id);
  if (!item) return;
  pendingCalls.delete(data.id);
  clearTimeout(item.timer);
  if (data.ok) item.resolve(data.result);
  else item.reject(new Error(data.error || '연결 오류'));
});
async function awaitBridge() {
  if (bridgeReady) return;
  const started = Date.now();
  while (!bridgeReady) {
    if (Date.now() - started > 20000) throw new Error('GAS 브리지 연결 시간 초과. 배포 URL 및 접속 권한을 확인해 주세요.');
    bridgePing();
    await new Promise(r => setTimeout(r, 650));
  }
}
const call = async (name, ...args) => {
  await awaitBridge();
  return new Promise((resolve, reject) => {
    const id = 'req_' + (++nextCallId) + '_' + Date.now();
    const timer = setTimeout(() => {
      pendingCalls.delete(id);
      reject(new Error('GAS 응답 시간이 초과되었습니다. 잠시 후 다시 시도해 주세요.'));
    }, 60000);
    pendingCalls.set(id, {resolve, reject, timer});
    bridgeFrame.contentWindow.postMessage({
      channel:BRIDGE_CHANNEL, kind:'request', id, method:name, args
    }, bridgeOrigin);
  });
};
const errorText=e=>e?.message||String(e);
function setBusy(value){working=value;$('modalContent').querySelectorAll('[data-submit]').forEach(b=>b.disabled=value)}
async function load(){try{const data=await call('getPortalData');items=data.items||[];settings=data.settings||{};applySettings();render()}catch(e){$('cards').innerHTML='<div class="empty">데이터를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</div>';toast(errorText(e))}}
function applySettings(){document.title=settings.appName||'GAS 앱 모음';$('appTitle').textContent=settings.appTitle||'나의 GAS 앱 모음';$('subtitle').textContent=settings.appSubtitle||'';$('badge').textContent=settings.appBadge||'CAP89';$('footerText').textContent=settings.footerText||''}
function thumb(item){const img=validUrl(item.image||'');return img?`<img src="${escapeHtml(img)}" alt="${escapeHtml(item.title)} 미리보기" loading="lazy" onerror="this.parentElement.innerHTML='&lt;span class=&quot;fallback&quot;&gt;🧩&lt;/span&gt;'">`:'<span class="fallback">🧩</span>'}
function render(){
  const categories=[...new Set(items.map(x=>x.category||'기타'))].sort((a,b)=>a.localeCompare(b,'ko'));
  if(selectedCategory!=='all'&&!categories.includes(selectedCategory))selectedCategory='all';
  $('heroCategories').innerHTML=['all',...categories].map(category=>{
    const label=category==='all'?'전체':category;
    const count=category==='all'?items.length:items.filter(x=>(x.category||'기타')===category).length;
    return `<button type="button" class="hero-chip ${selectedCategory===category?'active':''}" data-category="${escapeHtml(category)}" aria-pressed="${selectedCategory===category}">${escapeHtml(label)} ${count}</button>`;
  }).join('');
  const query=$('search').value.trim().toLowerCase();
  let shown=items.filter(x=>(filter==='all'||x.copyUrl)&&(selectedCategory==='all'||(x.category||'기타')===selectedCategory)&&(`${x.title} ${x.category||''} ${x.desc} ${x.instruction}`).toLowerCase().includes(query));
  if(sort==='title')shown.sort((a,b)=>a.title.localeCompare(b.title,'ko'));$('totalStat').textContent=`전체 앱 ${items.length}개`;$('copyStat').textContent=`사본 제공 ${items.filter(x=>x.copyUrl).length}개`;$('cards').className='cards'+(view==='list'?' list-view':'');$('cards').innerHTML=shown.length?shown.map((item,i)=>`<article class="card" style="animation-delay:${Math.min(i*35,250)}ms">${token?`<button class="edit-pencil" data-edit="${escapeHtml(item.id)}" aria-label="${escapeHtml(item.title)} 수정">✏️</button>`:''}<div class="thumb" data-detail="${escapeHtml(item.id)}">${thumb(item)}</div><div class="card-body"><span class="category-badge">${escapeHtml(item.category||'기타')}</span><h3>${escapeHtml(item.title)}</h3><div class="desc">${escapeHtml(item.desc||'설명을 등록해 주세요.')}</div><div class="card-bottom"><button class="btn small primary" data-detail="${escapeHtml(item.id)}">자세히 보기 →</button>${item.copyUrl?'<span class="pill">📋 사본 제공</span>':''}</div></div></article>`).join(''):'<div class="empty">조건에 맞는 앱이 없습니다.</div>';$('newBtn').classList.toggle('hidden',!token);$('logoutBtn').classList.toggle('hidden',!token);$('adminBtn').textContent=token?'⚙️ 사이트 설정':'⚙️ 관리';$('adminBtn').setAttribute('aria-label',token?'사이트 설정 열기':'관리자 로그인')}
function openModal(title,html,type,narrow=false){modalType=type;$('modalTitle').textContent=title;$('modalContent').innerHTML=html;$('modal').classList.toggle('narrow',narrow);$('overlay').classList.add('show');document.body.style.overflow='hidden';setTimeout(()=>$('modalContent').querySelector('input,button,a')?.focus(),40)}
function closeModal(){if(working)return;$('overlay').classList.remove('show');document.body.style.overflow='';modalType=''}
function getItem(id){return items.find(x=>String(x.id)===String(id))}
function detail(id){const x=getItem(id);if(!x)return;let html=`${x.image?`<img class="detail-img" src="${escapeHtml(validUrl(x.image))}" alt="미리보기" onerror="this.style.display='none'">`:''}<p style="line-height:1.7;white-space:pre-wrap">${escapeHtml(x.desc||'등록된 설명이 없습니다.')}</p>${x.instruction?`<h3>📌 사용법</h3><div class="instructions">${escapeHtml(x.instruction)}</div>`:''}<div class="modal-foot"><a class="btn primary" href="${escapeHtml(validUrl(x.url))}" target="_blank" rel="noopener noreferrer">🚀 앱 실행</a>${x.copyUrl?`<a class="btn" href="${escapeHtml(validUrl(x.copyUrl))}" target="_blank" rel="noopener noreferrer">📋 사본 만들기</a>`:''}${token?`<button class="btn" data-edit="${escapeHtml(x.id)}">✏️ 수정</button>`:''}</div>`;openModal(x.title,html,'detail')}
function loginModal(){openModal('🔐 관리자 로그인',`<p class="muted">Settings 시트에 등록된 관리자 비밀번호를 입력해 주세요.</p><form id="loginForm"><div class="form-row"><label for="password">관리자 비밀번호</label><input class="field" id="password" type="password" required autocomplete="current-password"></div><div class="modal-foot"><button class="btn primary" data-submit>로그인</button></div></form>`,'login',true)}
function settingsModal(){const fields=[['appName','브라우저 탭 이름'],['appTitle','사이트 제목'],['appSubtitle','사이트 안내 문구'],['appBadge','상단 작은 제목'],['footerText','하단 저작권 문구']];const html=`<form id="settingsForm">${fields.map(([key,label])=>`<div class="form-row"><label for="s_${key}">${label} (${key})</label><input class="field" id="s_${key}" value="${escapeHtml(settings[key]||'')}"></div>`).join('')}<div class="modal-foot"><button class="btn primary" data-submit>설정 저장</button></div></form><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h3>📚 앱 관리</h3><p class="muted">☰을 끌어 순서를 바꾸고 순서 저장을 눌러 주세요.</p><ul class="edit-list" id="editList">${items.map(x=>`<li draggable="true" data-id="${escapeHtml(x.id)}"><span class="handle">☰</span><span>${escapeHtml(x.title)}</span><button class="btn small" data-edit="${escapeHtml(x.id)}" type="button">✏️</button></li>`).join('')}</ul><div class="modal-foot"><button class="btn" id="orderSave" type="button" data-submit>순서 저장</button><button class="btn" id="passwordChangeBtn" type="button">비밀번호 변경</button></div>`;openModal('⚙️ 사이트 설정 및 관리',html,'settings');setupDrag()}
function editModal(id=''){const x=id?getItem(id):null;editId=id;imageValue=x?.image||'';imageRemoved=false;openModal(id?'✏️ 앱 정보 수정':'➕ 새 앱 등록',`<form id="itemForm"><div class="form-grid"><div class="form-row"><label for="itemTitle">앱 이름 *</label><input class="field" id="itemTitle" required value="${escapeHtml(x?.title||'')}"></div><div class="form-row"><label for="itemUrl">실행 URL *</label><input class="field" id="itemUrl" required value="${escapeHtml(x?.url||'')}"></div><div class="form-row">
<label for="itemCategory">카테고리 *</label>
<select class="field" id="itemCategory" required>
${[...new Set([...DEFAULT_CATEGORIES,...items.map(v=>v.category||'기타'),x?.category||'기타'])].filter(Boolean).map(c=>`<option value="${escapeHtml(c)}" ${c===(x?.category||'기타')?'selected':''}>${escapeHtml(c)}</option>`).join('')}
<option value="__new__">＋ 새 카테고리 추가</option>
</select>
<div class="hidden" id="newCategoryArea" style="margin-top:9px">
<label for="newCategoryName">새 카테고리 이름</label>
<input class="field" id="newCategoryName" maxlength="40" placeholder="예: 학교업무" autocomplete="off">
<p class="muted">이름을 입력하고 저장하면 상단 카테고리에도 표시됩니다.</p>
</div>
</div><div class="form-row wide"><label for="itemCopy">사본 만들기 URL</label><input class="field" id="itemCopy" value="${escapeHtml(x?.copyUrl||'')}"></div><div class="form-row wide"><label for="itemDesc">간단한 설명</label><textarea class="field" id="itemDesc">${escapeHtml(x?.desc||'')}</textarea></div><div class="form-row wide"><label for="itemInstruction">상세 사용법</label><textarea class="field" id="itemInstruction">${escapeHtml(x?.instruction||'')}</textarea></div></div><div class="form-row"><label>대표 이미지</label><div class="upload-zone" id="uploadZone" tabindex="0" role="button" aria-label="이미지 파일 선택 또는 이미지 붙여넣기"><div id="imagePreview">${imageValue?`<img src="${escapeHtml(validUrl(imageValue))}" alt="기존 이미지">`:'🖼️ 클릭하여 이미지 등록 · Ctrl+V 붙여넣기'}</div></div><input id="fileInput" type="file" accept="image/*" hidden><div class="modal-foot"><button class="btn small" id="imageRemove" type="button">이미지 제거</button></div></div><div class="modal-foot">${id?'<button class="btn danger" id="deleteBtn" type="button">삭제</button>':''}<button class="btn primary" data-submit>저장하기</button></div></form>`,'edit');$('itemCategory').onchange=()=>{const custom=$('itemCategory').value==='__new__';$('newCategoryArea').classList.toggle('hidden',!custom);$('newCategoryName').required=custom;if(custom)$('newCategoryName').focus()};$('uploadZone').onclick=()=>$('fileInput').click();$('uploadZone').onkeydown=e=>{if(e.key==='Enter'){$('fileInput').click();e.preventDefault()}};$('fileInput').onchange=e=>{if(e.target.files[0])compressImage(e.target.files[0])};$('imageRemove').onclick=()=>{imageValue='';imageRemoved=true;$('imagePreview').textContent='🖼️ 이미지 없음'};if(id)$('deleteBtn').onclick=()=>confirmDelete(id)}
function compressImage(file){if(!file.type.startsWith('image/'))return toast('이미지 파일만 등록할 수 있습니다.');const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{const w=Math.min(850,im.width),h=Math.round(im.height*w/im.width),canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(im,0,0,w,h);imageValue=canvas.toDataURL('image/jpeg',.78);imageRemoved=false;$('imagePreview').innerHTML=`<img src="${imageValue}" alt="새 이미지 미리보기">`;toast('이미지를 준비했습니다.')};im.src=reader.result};reader.readAsDataURL(file)}
function confirmDelete(id){const x=getItem(id);openModal('🗑️ 앱 삭제',`<p><strong>${escapeHtml(x?.title||'')}</strong> 앱을 삭제하시겠습니까?</p><p class="muted">Links 시트에서 해당 행이 삭제됩니다. 원본 GAS 앱 자체는 삭제되지 않습니다.</p><div class="modal-foot"><button class="btn" id="deleteCancel">취소</button><button class="btn danger" id="deleteConfirm" data-submit>삭제하기</button></div>`,'delete',true);editId=id;$('deleteCancel').onclick=closeModal;$('deleteConfirm').onclick=deleteCurrent}
async function deleteCurrent(){setBusy(true);try{items=await call('deleteMenuItemFromSheet',token,editId);setBusy(false);closeModal();render();toast('앱 목록에서 삭제했습니다.')}catch(e){setBusy(false);toast(errorText(e))}}
async function login(e){e.preventDefault();setBusy(true);try{token=await call('verifyAdminPassword',$('password').value);setBusy(false);closeModal();render();toast('관리자 모드로 전환했습니다.')}catch(e){setBusy(false);toast(errorText(e))}}
async function saveItem(e){e.preventDefault();if($('itemCategory').value==='__new__'&&!$('newCategoryName').value.trim()){toast('새 카테고리 이름을 입력해 주세요.');$('newCategoryName').focus();return;}const payload={id:editId,title:$('itemTitle').value.trim(),category:($('itemCategory').value==='__new__' ? $('newCategoryName').value.trim() : $('itemCategory').value.trim())||'기타',url:$('itemUrl').value.trim(),copyUrl:$('itemCopy').value.trim(),desc:$('itemDesc').value.trim(),instruction:$('itemInstruction').value.trim(),image:imageValue};setBusy(true);try{items=await call('saveMenuItemToSheet',token,payload);setBusy(false);closeModal();render();toast('앱 정보를 저장했습니다.')}catch(e){setBusy(false);toast(errorText(e))}}
async function saveSettings(e){e.preventDefault();const changes={};['appName','appTitle','appSubtitle','appBadge','footerText'].forEach(k=>changes[k]=$('s_'+k).value);setBusy(true);try{settings=await call('saveSettings',token,changes);setBusy(false);closeModal();applySettings();toast('설정을 저장했습니다.')}catch(e){setBusy(false);toast(errorText(e))}}
function changePasswordModal(){openModal('🔑 비밀번호 변경',`<form id="changeForm"><div class="form-row"><label for="newPassword">새 비밀번호 (6자 이상)</label><input id="newPassword" class="field" type="password" minlength="6" required></div><div class="modal-foot"><button class="btn primary" data-submit>변경하기</button></div></form>`,'changePw',true)}
async function changePassword(e){e.preventDefault();setBusy(true);try{await call('changeAdminPassword',token,$('newPassword').value);setBusy(false);closeModal();toast('관리자 비밀번호를 변경했습니다.')}catch(e){setBusy(false);toast(errorText(e))}}
function setupDrag(){let dragged=null;const list=$('editList');list.querySelectorAll('li').forEach(li=>{li.addEventListener('dragstart',()=>{dragged=li});li.addEventListener('dragover',e=>e.preventDefault());li.addEventListener('drop',e=>{e.preventDefault();if(!dragged||dragged===li)return;const r=li.getBoundingClientRect();list.insertBefore(dragged,e.clientY>r.top+r.height/2?li.nextSibling:li)})});$('orderSave').onclick=async()=>{const ids=[...list.querySelectorAll('li')].map(li=>li.dataset.id);setBusy(true);try{items=await call('updateMenuOrder',token,ids);setBusy(false);closeModal();render();toast('순서를 저장했습니다.')}catch(e){setBusy(false);toast(errorText(e))}};$('passwordChangeBtn').onclick=changePasswordModal}
$('cards').addEventListener('click',e=>{const ed=e.target.closest('[data-edit]');if(ed){editModal(ed.dataset.edit);return}const dt=e.target.closest('[data-detail]');if(dt)detail(dt.dataset.detail)});
$('modalContent').addEventListener('click',e=>{const ed=e.target.closest('[data-edit]');if(ed)editModal(ed.dataset.edit)});
$('modalContent').addEventListener('submit',e=>{if(working)return;switch(modalType){case'login':login(e);break;case'edit':saveItem(e);break;case'settings':saveSettings(e);break;case'changePw':changePassword(e);break}});
$('adminBtn').onclick=()=>token?settingsModal():loginModal();$('logoutBtn').onclick=async()=>{const old=token;token='';render();closeModal();try{await call('logoutAdmin',old)}catch(e){}toast('로그아웃했습니다.')};$('newBtn').onclick=()=>editModal();$('modalClose').onclick=closeModal;$('overlay').onclick=e=>{if(e.target===$('overlay'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});document.addEventListener('paste',e=>{if(modalType!=='edit'||working)return;const file=[...(e.clipboardData?.files||[])].find(f=>f.type.startsWith('image/'));if(file)compressImage(file)});
$('heroCategories').addEventListener('click',e=>{const btn=e.target.closest('[data-category]');if(!btn)return;selectedCategory=btn.dataset.category;render()});$('search').oninput=render;$('sort').onchange=e=>{sort=e.target.value;render()};$('filterAll').onclick=()=>{filter='all';$('filterAll').classList.add('active');$('filterCopy').classList.remove('active');render()};$('filterCopy').onclick=()=>{filter='copy';$('filterCopy').classList.add('active');$('filterAll').classList.remove('active');render()};$('viewBtn').onclick=()=>{view=view==='grid'?'list':'grid';$('viewBtn').textContent=view==='grid'?'☷ 목록':'▦ 카드';render()};try { bridgeInit(); load(); } catch (error) { $('cards').innerHTML = '<div class="empty">' + escapeHtml(error.message) + '</div>'; toast(error.message); }
</script>
</body>
</html>
